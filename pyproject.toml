[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolproof"
version = "0.1.0"
description = "Provenance-labelled tool calls for AI agents: a policy monitor, and a verifier that searches for call sequences that break your safety invariants."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-safety", "agents", "prompt-injection", "information-flow-control", "verification", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
toolproof = "toolproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
